name: Release builds

# Builds installers on native runners:
#   macOS Apple Silicon (aarch64) and Intel (x86_64): .app + .dmg
#   Windows 10/11 x64: .msi (WiX) + -setup.exe (NSIS)
# Run manually from the Actions tab, or push a tag such as v1.0.0 to create a draft GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test

      # Signing is optional: when these repository secrets are absent the build is unsigned
      # (fine for testing; see INSTALL_MACOS.md / INSTALL_WINDOWS.md for distribution).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('SmartText AI {0}', github.ref_name) || '' }}
          releaseDraft: true

      # Job logs are not always reachable; on failure, repeat the build and surface its last
      # lines as a single annotation, which the checks API and the run summary always show.
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          npm run tauri build -- ${{ matrix.args }} > build.log 2>&1 || true
          tail -n 60 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          echo "::error title=tauri build output::$(cat tail.txt)"

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smarttext-ai-${{ matrix.platform }}-${{ matrix.rust_targets || 'x64' }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn
