name: Release builds

# Builds installers on native runners:
#   macOS universal (Apple Silicon + Intel in one app): .dmg
#   Windows 10/11 x64: .msi (WiX) + -setup.exe (NSIS)
# The installers are always uploaded as workflow artifacts. A GitHub release with the installers
# attached is created when a tag such as v1.0.0 is pushed, or when the workflow is run from the
# Actions tab with "release_tag" filled in (the tag is then created on the selected commit).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""
      macos_runner:
        description: "macOS runner label (try macos-15-intel when arm64 runners are busy)"
        required: false
        default: "macos-latest"
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app that runs natively on both Apple Silicon and Intel Macs.
          - name: macOS (universal)
            platform: ${{ inputs.macos_runner || 'macos-latest' }}
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macos-universal
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""
            artifact: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test

      # Signing is optional. Unset secrets arrive as empty strings, and an empty APPLE_CERTIFICATE
      # makes the bundler try (and fail) to import a certificate, so empty values are removed.
      # See INSTALL_MACOS.md / INSTALL_WINDOWS.md for signing and notarization.
      - name: Build installers
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          # The macOS DMG step drives Finder and is occasionally flaky on hosted runners: retry.
          for attempt in 1 2 3; do
            if npm run tauri build -- ${{ matrix.args }} > build.log 2>&1; then cat build.log; exit 0; fi
            # Surface the error as an annotation (job logs are not always reachable).
            grep -v "^dist/" build.log | sed 's/\x1b\[[0-9;]*m//g' | tail -n 25 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
            echo "::warning title=tauri build attempt $attempt failed::$(cat tail.txt)"
          done
          exit 1

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*release/bundle/*' \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} out/ \;
          # Release asset names cannot contain spaces.
          for f in out/*; do mv "$f" "out/$(basename "$f" | tr ' ' '-')"; done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: smarttext-ai-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    # Runs even when one platform failed (e.g. no macOS runner was available), so the installers
    # that did build are published; re-running later adds the missing ones to the same release.
    if: always() && needs.build.result != 'skipped' && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          **SmartText AI** — designed and developed by Ismaiel Almarie.

          | Your computer | Download |
          |---|---|
          | Any Mac (Apple Silicon or Intel), macOS 10.15+ | `SmartText-AI_*_universal.dmg` |
          | Windows 10 / 11 (64-bit) | `SmartText-AI_*_x64-setup.exe` (or the `.msi` for IT deployment) |

          These builds are not code-signed. On macOS, right-click the app and choose **Open** the first time
          (or run `xattr -dr com.apple.quarantine "/Applications/SmartText AI.app"`). On Windows, if SmartScreen
          appears, choose **More info → Run anyway**. See `INSTALL_GUIDE_AR.pdf` in the repository (Arabic).
          EOF
          ls installers/* > /dev/null || { echo "::error::No installers were built."; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SmartText AI ${TAG#v}" --notes-file notes.md
          fi
